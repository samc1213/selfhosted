- name: Ensure mailcow directory exists and is owned by sam
  become: true
  become_user: root
  ansible.builtin.file:
    path: /blkstg/mailcow-dockerized
    state: directory
    owner: sam
    group: sam
    mode: '755'

- name: Clone mailcow-dockerized
  ansible.builtin.git:
    repo: https://github.com/mailcow/mailcow-dockerized.git
    dest: /blkstg/mailcow-dockerized
    version: master
    force: true

- name: Symlink .env to mailcow.conf
  ansible.builtin.file:
    src: mailcow.conf
    dest: /blkstg/mailcow-dockerized/.env
    state: link
    force: true

- name: Check for existing mailcow.conf
  ansible.builtin.stat:
    path: /blkstg/mailcow-dockerized/mailcow.conf
  register: mailcow_conf_stat

- name: Generate mailcow.conf
  ansible.builtin.command:
    cmd: bash generate_config.sh
    chdir: /blkstg/mailcow-dockerized
  environment:
    MAILCOW_HOSTNAME: "{{ mailcow_hostname }}"
    MAILCOW_TZ: America/Denver
    SKIP_CLAMD: "n"
    SKIP_BRANCH: "y"
  when: not mailcow_conf_stat.stat.exists

- name: Configure mailcow.conf overrides
  ansible.builtin.lineinfile:
    path: /blkstg/mailcow-dockerized/mailcow.conf
    regexp: '^{{ item.key }}='
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: HTTP_PORT, value: "8290" }
    - { key: HTTP_BIND, value: "127.0.0.1" }
    - { key: HTTPS_BIND, value: "127.0.0.1" }
    - { key: HTTPS_PORT, value: "8443" }
    - { key: SKIP_LETS_ENCRYPT, value: "y" }
    - { key: IPV4_NETWORK, value: "172.23.1" }
    - { key: HTTP_REDIRECT, value: "n" }
  notify: Recreate mailcow containers

- name: Ensure postfix conf directory exists
  ansible.builtin.file:
    path: /blkstg/mailcow-dockerized/data/conf/postfix
    state: directory
    mode: '755'

- name: Configure postfix relay
  ansible.builtin.template:
    src: extra.cf.j2
    dest: /blkstg/mailcow-dockerized/data/conf/postfix/extra.cf
    mode: '644'
  notify: Restart mailcow postfix

- name: Configure postfix relay credentials
  ansible.builtin.template:
    src: sasl_passwd.j2
    dest: /blkstg/mailcow-dockerized/data/conf/postfix/sasl_passwd
    mode: '600'
  notify: Restart mailcow postfix

- name: Check for existing roundcube DB credentials
  ansible.builtin.command:
    cmd: grep -q '^DBROUNDCUBE=' mailcow.conf
    chdir: /blkstg/mailcow-dockerized
  register: roundcube_creds_check
  failed_when: false
  changed_when: false

- name: Generate roundcube DB credentials
  ansible.builtin.shell:
    cmd: |
      echo "DBROUNDCUBEROOT=$(openssl rand -hex 24)" >> mailcow.conf
      echo "DBROUNDCUBE=$(openssl rand -hex 24)" >> mailcow.conf
    chdir: /blkstg/mailcow-dockerized
  when: roundcube_creds_check.rc != 0

- name: Configure roundcube webmail
  ansible.builtin.copy:
    src: docker-compose.override.yml
    dest: /blkstg/mailcow-dockerized/docker-compose.override.yml
    mode: '644'
  notify: Recreate mailcow containers

- name: Ensure roundcube config directory exists
  ansible.builtin.file:
    path: /blkstg/mailcow-dockerized/data/rc/config
    state: directory
    mode: '755'

- name: Configure roundcube to trust dovecot's TLS cert by container name
  ansible.builtin.copy:
    src: roundcube-imap-tls.php
    dest: /blkstg/mailcow-dockerized/data/rc/config/imap_conn_options.php
    mode: '644'
  notify: Recreate mailcow containers

- name: Start mailcow
  community.docker.docker_compose_v2:
    project_src: /blkstg/mailcow-dockerized
    files:
      - docker-compose.yml
      - docker-compose.override.yml
    pull: always
    remove_orphans: true

- name: Deploy certbot renewal hook for mailcow's IMAP/SMTP cert
  become: true
  become_user: root
  ansible.builtin.copy:
    src: mailcow-cert-deploy-hook.sh
    dest: /etc/letsencrypt/renewal-hooks/deploy/mailcow-cert.sh
    mode: '755'
