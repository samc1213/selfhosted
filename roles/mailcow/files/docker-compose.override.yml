      o: bind
  rspamd-vol-1:
    driver_opts:
      type: none
      device: /blkstg/mailcow-dockerized/data/docker-volumes/rspamd-vol-1
      o: bind
  postfix-vol-1:
    driver_opts:
      type: none
      device: /blkstg/mailcow-dockerized/data/docker-volumes/postfix-vol-1
      o: bind
  postfix-tlspol-vol-1:
    driver_opts:
      type: none
      device: /blkstg/mailcow-dockerized/data/docker-volumes/postfix-tlspol-vol-1
      o: bind
  crypt-vol-1:
    driver_opts:
