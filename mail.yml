- name: Setup mailcow
  hosts: "{{ target if target is defined else 'production' }}"
  vars:
    mailcow_hostname: mail.samacohen.com
    # mailcow release tag (https://github.com/mailcow/mailcow-dockerized/releases).
    # Bump deliberately after reading the release notes; deploying pulls the new
    # images and recreates the changed containers.
    mailcow_version: "2026-10"
  tasks:
    - name: Deploy mailcow
      ansible.builtin.include_role:
        name: mailcow

    - name: Add nginx configuration for mail
      become: true
      become_user: root
      ansible.builtin.template:
        src: templates/nginx_server.j2
        dest: /etc/nginx/sites-available/mail
        mode: '777'
      vars:
        nginx_server_name: mail
        nginx_server_local_port: 8290

    - name: Make nginx site enabled for mail
      become: true
      become_user: root
      ansible.builtin.file:
        src: /etc/nginx/sites-available/mail
        dest: /etc/nginx/sites-enabled/mail
        state: link
      notify:
        - Reload nginx

    - name: Setup certbot for mail
      become: true
      become_user: root
      ansible.builtin.command:
        cmd: certbot certonly --agree-tos --non-interactive --nginx -d mail.samacohen.com

    # Only restart the TLS services when the cert actually changed; restarting
    # them on every deploy dropped IMAP/SMTP connections for no reason
    - name: Copy the certbot cert into mailcow for IMAP/SMTP TLS
      become: true
      become_user: root
      ansible.builtin.copy:
        src: "/etc/letsencrypt/live/mail.samacohen.com/{{ item.src }}"
        dest: "/blkstg/mailcow-dockerized/data/assets/ssl/{{ item.dest }}"
        remote_src: true
        owner: sam
        group: sam
        mode: '664'
      loop:
        - { src: fullchain.pem, dest: cert.pem }
        - { src: privkey.pem, dest: key.pem }
      notify:
        - Restart mailcow TLS services

    # Cache for the calendar share link in the mail nginx config
    - name: Create nginx cache directory for the calendar share link
      become: true
      become_user: root
      ansible.builtin.file:
        path: /var/cache/nginx/calshare
        state: directory
        owner: www-data
        group: root
        mode: '700'
      when: calshare_path is defined

    # The shared calendar link only goes live once calshare_path,
    # calshare_user and calshare_app_password are set in secrets_file.enc
    - name: Add https to nginx for mail
      become: true
      become_user: root
      ansible.builtin.blockinfile:
        block: "{{ lookup('ansible.builtin.template', './templates/nginx_server_https_mail.j2') }}"
        path: /etc/nginx/sites-enabled/mail
      notify:
        - Reload nginx

    - name: Add nginx configuration for roundcube
      become: true
      become_user: root
      ansible.builtin.template:
        src: templates/nginx_server.j2
        dest: /etc/nginx/sites-available/roundcube
        mode: '777'
      vars:
        nginx_server_name: roundcube
        nginx_server_local_port: 8291

    - name: Make nginx site enabled for roundcube
      become: true
      become_user: root
      ansible.builtin.file:
        src: /etc/nginx/sites-available/roundcube
        dest: /etc/nginx/sites-enabled/roundcube
        state: link
      notify:
        - Reload nginx

    - name: Setup certbot for roundcube
      become: true
      become_user: root
      ansible.builtin.command:
        cmd: certbot certonly --agree-tos --non-interactive --nginx -d roundcube.samacohen.com

    - name: Add https to nginx for roundcube
      become: true
      become_user: root
      ansible.builtin.blockinfile:
        block: "{{ lookup('ansible.builtin.template', './templates/nginx_server_https_roundcube.j2') }}"
        path: /etc/nginx/sites-enabled/roundcube
      notify:
        - Reload nginx

  handlers:
    - name: Reload nginx
      become: true
      become_user: root
      ansible.builtin.command: nginx -s reload
      changed_when: true

    - name: Restart mailcow TLS services
      ansible.builtin.command:
        cmd: docker compose restart postfix-mailcow dovecot-mailcow nginx-mailcow
        chdir: /blkstg/mailcow-dockerized
      changed_when: true
