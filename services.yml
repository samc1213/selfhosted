- name: Setup services
  hosts: "{{ target if target is defined else 'production' }}"
  vars:
    services:
      - name: bitwarden
        internalport: 8280
        public: true
      - name: freshrss
        internalport: 8281
        password: true
      - name: wallabag
        internalport: 8282
      - name: mealie
        internalport: 8283
      - name: vikunja
        internalport: 8284
      - name: mealie-kroger
        internalport: 8286
      - name: movie-wheel
        internalport: 8287
      - name: recycling
        internalport: 3000
      - name: nextcloud
        internalport: 11000
      - name: ghostfolio
        internalport: 3333
      - name: kimai
        internalport: 8288
      - name: immich
        internalport: 8289
  tasks:
    - name: Add docker compose services
      ansible.builtin.include_role:
        name: dockercomposeservice
      vars:
        dockercomposeservice_name: "{{ item.name }}"
      loop:
        "{{ services }}"
    - name: Add tailnet DNS for tailnet-only services
      ansible.builtin.include_role:
        name: dockercomposeservice
      vars:
        dockercomposeservice_name: tailnet-dns
    - name: Add nginx configurations
      become: true
      become_user: root
      ansible.builtin.template:
        src: templates/nginx_server.j2
        dest: "/etc/nginx/sites-available/{{ item.name }}"
        mode: '777'
      vars:
        nginx_server_name: "{{ item.name }}"
        nginx_server_local_port: "{{ item.internalport }}"
      loop:
        "{{ services }}"
    - name: Make nginx sites enabled
      become: true
      become_user: root
      ansible.builtin.file:
        src: /etc/nginx/sites-available/{{ item.name }}
        dest: /etc/nginx/sites-enabled/{{ item.name }}
        state: link
      loop:
        "{{ services }}"
      notify:
        - Reload nginx
    - name: Setup certbot
      become: true
      become_user: root
      ansible.builtin.command:
        cmd: certbot certonly --agree-tos --non-interactive --nginx -d {{ item.name  }}.samacohen.com
      loop:
        "{{ services }}"
    - name: Setup certbot renewal
      import_role:
        name: systemdtimer
      vars:
        systemdtimer_servicename: certbot-renew
        systemdtimer_oncalendar: "*-*-* 10:00:00 America/Denver"
        systemdtimer_command: certbot renew
    - name: Add nginx tailnet-only allowlist snippet
      become: true
      become_user: root
      ansible.builtin.copy:
        src: templates/nginx_tailnet_only.conf
        dest: /etc/nginx/snippets/tailnet-only.conf
        mode: '644'
      notify:
        - Reload nginx
    - name: Generate basic auth for password-protected services
      become: true
      become_user: root
      ansible.builtin.shell:
        cmd: |
          pw=$(openssl rand -base64 24)
          echo "sam:$(openssl passwd -apr1 "$pw")" > /etc/nginx/htpasswd-{{ item.name }}
          chown root:www-data /etc/nginx/htpasswd-{{ item.name }}
          chmod 640 /etc/nginx/htpasswd-{{ item.name }}
          echo "user: sam" > /root/{{ item.name }}-basic-auth.txt
          echo "password: $pw" >> /root/{{ item.name }}-basic-auth.txt
          chmod 600 /root/{{ item.name }}-basic-auth.txt
        creates: /etc/nginx/htpasswd-{{ item.name }}
      loop: "{{ services | selectattr('password', 'defined') | selectattr('password') | list }}"
      no_log: true
    - name: Add https to nginx
      become: true
      become_user: root
      ansible.builtin.blockinfile:
        block: "{{ lookup('ansible.builtin.template', './templates/nginx_server_https.j2') }}"
        path: /etc/nginx/sites-enabled/{{ item.name }}
      vars:
        nginx_server_name: "{{ item.name }}"
        nginx_server_local_port: "{{ item.internalport }}"
        nginx_public: "{{ item.public | default(false) }}"
        nginx_password: "{{ item.password | default(false) }}"
      loop:
        "{{ services }}"
      notify:
        - Reload nginx

  handlers:
    - name: Reload nginx
      become: true
      become_user: root
      ansible.builtin.command: nginx -s reload
      changed_when: true
