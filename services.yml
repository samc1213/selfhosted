- name: Setup services
  hosts: "{{ target if target is defined else 'production' }}"
  vars:
    services:
      - name: bitwarden
        internalport: 8280
      - name: freshrss
        internalport: 8281
      - name: wallabag
        internalport: 8282
      - name: mealie
        internalport: 8283
      - name: vikunja
        internalport: 8284
      - name: mealie-kroger
        internalport: 8286
      - name: movie-wheel
        internalport: 8287
      - name: recycling
        internalport: 3000
      - name: ghostfolio
        internalport: 3333
      - name: kimai
        internalport: 8288
      - name: immich
        internalport: 8289
  tasks:
    - name: Add docker compose services
      ansible.builtin.include_role:
        name: dockercomposeservice
      vars:
        dockercomposeservice_name: "{{ item.name }}"
      loop:
        "{{ services }}"
    - name: Add nginx site and cert for each service
      ansible.builtin.include_tasks: tasks/nginx_site.yml
      vars:
        nginx_server_name: "{{ item.name }}"
        nginx_server_local_port: "{{ item.internalport }}"
        nginx_https_template: nginx_server_https.j2
      loop:
        "{{ services }}"
    - name: Setup certbot renewal
      import_role:
        name: systemdtimer
      vars:
        systemdtimer_servicename: certbot-renew
        systemdtimer_oncalendar: "*-*-* 10:00:00 America/Denver"
        systemdtimer_command: certbot renew

  handlers:
    - name: Reload nginx
      become: true
      become_user: root
      ansible.builtin.command: nginx -s reload
      changed_when: true
