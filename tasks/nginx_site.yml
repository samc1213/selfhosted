# Writes a site's complete nginx config (HTTP redirect + HTTPS server) in one
# template, so a deploy that fails partway can never leave a site without its
# HTTPS block. The cert is only requested the first time; renewals are handled
# by the certbot-renew timer.
#
# Vars: nginx_server_name, nginx_server_local_port, nginx_https_template
- name: Check for {{ nginx_server_name }} cert
  become: true
  become_user: root
  ansible.builtin.stat:
    path: /etc/letsencrypt/live/{{ nginx_server_name }}.samacohen.com/fullchain.pem
  register: nginx_site_cert

- name: Write nginx config for {{ nginx_server_name }}
  become: true
  become_user: root
  ansible.builtin.template:
    src: templates/nginx_site.j2
    dest: /etc/nginx/sites-available/{{ nginx_server_name }}
    mode: '644'
  vars:
    nginx_https_enabled: "{{ nginx_site_cert.stat.exists }}"
  notify:
    - Reload nginx

- name: Enable nginx site for {{ nginx_server_name }}
  become: true
  become_user: root
  ansible.builtin.file:
    src: /etc/nginx/sites-available/{{ nginx_server_name }}
    dest: /etc/nginx/sites-enabled/{{ nginx_server_name }}
    state: link
  notify:
    - Reload nginx

- name: Get a cert for {{ nginx_server_name }} (first deploy only)
  become: true
  become_user: root
  ansible.builtin.command:
    cmd: certbot certonly --agree-tos --non-interactive --nginx -d {{ nginx_server_name }}.samacohen.com
    creates: /etc/letsencrypt/live/{{ nginx_server_name }}.samacohen.com/fullchain.pem
  register: nginx_site_certbot

- name: Add HTTPS to nginx config for {{ nginx_server_name }} now that its cert exists
  become: true
  become_user: root
  ansible.builtin.template:
    src: templates/nginx_site.j2
    dest: /etc/nginx/sites-available/{{ nginx_server_name }}
    mode: '644'
  vars:
    nginx_https_enabled: true
  when: nginx_site_certbot is changed
  notify:
    - Reload nginx
